name: Linux release

on:
  workflow_dispatch:
  push:
    tags: ['0.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libssl-dev protobuf-compiler
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy && rustup default 1.99.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace -- --skip test_get_xbox_live_dev_token
      - run: cargo build --locked --release -p xodus-cli -p xodus-service
      - name: Package Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xodus-cli") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag and crate version differ" >&2
            exit 1
          fi
          mkdir -p dist
          strip target/release/xodus-cli target/release/xodus-service
          tar -czf "dist/xodus-${version}-linux-x86_64.tar.gz" LICENSE -C target/release xodus-cli xodus-service
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xodus-linux-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: xodus-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Xodus $GITHUB_REF_NAME" --notes-file "docs/release-${GITHUB_REF_NAME}.md" --latest
